<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - PlateForward</title><link rel="stylesheet" href="css/style.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html"><span class="logo-mark"></span>PlateForward</a><nav class="nav-links"></nav><div class="nav-actions"></div><button class="mobile-menu">☰</button></div></header><main class="auth-page"><section class="auth-card"><div class="auth-brand"><a class="logo" href="index.html"><span class="logo-mark"></span>PlateForward</a></div><h1 id="authTitle">Welcome back</h1><p class="sub">Access the PlateForward community with your account.</p><div class="auth-tabs"><button type="button" data-auth-mode="login">Log in</button><button type="button" data-auth-mode="signup">Sign up</button></div><form id="authForm"><div class="form-group" id="nameGroup"><label>Full name</label><input id="name" class="input" placeholder="Your name"></div><div class="method-tabs"><button type="button" data-method="email">Email & password</button><button type="button" data-method="phone">Phone & OTP</button></div><div class="form-group" id="emailGroup"><label>Email</label><input id="email" class="input" type="email" placeholder="you@example.com"></div><div class="form-group" id="passwordGroup"><label>Password</label><input id="password" class="input" type="password" placeholder="At least 6 characters"></div><div class="form-group" id="phoneGroup"><label>Phone number</label><input id="phone" class="input" type="tel" placeholder="9876543210"></div><div class="form-group" id="otpGroup"><label>One-time password</label><input id="otp" class="input" inputmode="numeric" placeholder="Enter OTP here"></div><div class="form-group"><label>Choose how you participate</label><div class="role-options"><div class="role-option" data-role="donor"><strong>Donor</strong><small>Share surplus food and manage listings.</small></div><div class="role-option" data-role="receiver"><strong>Receiver</strong><small>Find available food and claim pickups.</small></div></div></div><button id="authSubmit" class="btn btn-primary" type="submit" style="width:100%;margin-top:8px">Log in</button></form><p class="sub" style="text-align:center;margin:18px 0 0"><span id="switchText">New to PlateForward?</span> <a id="switchLink" href="auth.html?mode=signup" style="color:var(--primary);font-weight:800">Sign up</a></p></section></main><div class="toast"></div><script src="js/data.js"></script><script src="js/auth.js"></script></body></html>
